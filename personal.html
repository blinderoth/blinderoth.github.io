<!-- The timeline is built here, before site.js runs. -->
<script>
  /* ===============================================================
     HOW TO EDIT THIS PAGE

     Every entry is one block like this:

       {
         year: 2018,
         title: "Title of the entry",
         when: "Summer 2018",            // optional small line under the title
         rating: 3.5,                    // optional stars, 0 to 5 in steps of 0.5
         body: [
           "A paragraph of text.",
           { img: "images/photo.jpg", alt: "What the picture shows", caption: "Optional caption" },
           "More text after the picture."
         ]
       },

     Four rules, because breaking any of them stops the whole page:
     1. All entries sit inside ONE list: it opens with "var ENTRIES = [" and
        closes with a single "];" after the very last entry.
     2. Entries are separated by a comma after their closing "}".
     3. Each paragraph is its own text in straight quotes "like this", with a
        comma between paragraphs. No line breaks inside the quotes.
     4. Inside a paragraph, quote things with curly quotes “like this” or
        single quotes. A straight double quote " ends the text early.

     Within a year, entries appear in the order they are listed, so put the
     newest first.
     - Several entries can share a year.
     - body mixes paragraphs (text in quotes) and pictures (the { img: ... } part)
       in the order you want them to appear.
     - Put your picture files in a folder called "images" next to this file.
     - While "img" is empty (""), a dashed placeholder box is shown instead.
     - To start with the oldest year at the top, change NEWEST_FIRST to false.
     =============================================================== */

  var NEWEST_FIRST = true;

  function placeholder(year) {
    return {
      year: year,
      title: "Title placeholder",
      when: "Date placeholder",
      body: [
        "Text placeholder. Write the first paragraph here.",
        { img: "", alt: "", caption: "Picture placeholder" },
        "Text placeholder. Continue after the picture here."
      ]
    };
  }

  var ENTRIES = [
    placeholder(2016),
    placeholder(2017),
    placeholder(2018),
    placeholder(2019),
    placeholder(2020),
    placeholder(2021),
    placeholder(2022),
    placeholder(2024),
    placeholder(2025),

    {
      year: 2026,
      title: "Book review: Nudge",
      when: "October 7, 2026",
      rating: 4,
	  body: [
        "Review of Nudge by Richard H. Thaler and Cass R. Sunstein.",
        { img: "images/nudge.jpg", alt: "Cover of Nudge: The Final Edition by Richard H. Thaler and Cass R. Sunstein", caption: "Book cover" },
        "The cover quotes Daniel Kahneman: “Few books can be said to have changed the world, but Nudge did. The Final Edition is marvellous: funny, useful, and wise.”",
        "I can’t say whether the first part is true, but I agree more with the second.",
        "Some readers criticize the book for being aimed too heavily at the US market and population. I see the point, but the underlying theories and concepts are still interesting. Sweden also comes up a few times as a comparison to the US system, and as a Swede that made the examples far more relatable, so I may be biased.",
        "I started this book in 2023, and as of 2026 I still haven’t finished it. Maybe it’s because I did a bachelor’s degree in between and had no energy left for an economics pop-science book in my free time. Maybe it’s because I had the physical copy and tend to read more on my Kindle. Or maybe the book just doesn’t create that yearning to turn the page.",
        "That said, I think I got most of the Nudge concept after about half the book. And since first reading about it in 2023, it has stayed on my mind. Behavioral economics is such a simple idea on the surface, yet complex and intricate once you dig into it. I truly believe that anyone making decisions about things like social policy or business KPIs would benefit from knowing the concept and working with incentives.",
        "If you’re curious about behavioral economics, it’s worth picking up, but don’t feel bad about stopping when the ideas start to repeat."
      ]
    },

    {
      year: 2026,
      title: "Book review: All Systems Red",
      when: "September 28, 2026",
      rating: 3.5,
      body: [
        "Review of All Systems Red by Martha Wells.",
        { img: "images/all-systems-red.jpg", alt: "Cover of All Systems Red by Martha Wells", caption: "Book cover" },
        "For context, I've now finished book #4 in the series.",
        "This rating reflects my first read-through, and honestly, the book felt flat. It has almost no environmental description, which made it hard to immerse myself in the story or the world. I couldn't see what the hype was about, and it did very little for me. Still, it was a clear improvement on the #0.5 entry (Compulsory, which I've also reviewed), hence the 3.5 stars.",
        "However, and I can't stress this enough: after finishing, I went looking online for what I was missing, and I realized I'd been reading it all wrong. The book is flat because it's Murderbot's diary, and Murderbot's view of the world is flat. Duh!",
        "Once I changed my perspective, book #2 was a completely different experience, and I couldn't stop reading. The intricate interactions between characters, Murderbot's strangely relatable feelings, the meta layer of Murderbot escaping reality while I escape reality too, and the punchy writing are all addictive.",
        "If you experienced the first book the way I did, stick with it. Change your perspective, and I'm confident you'll fall in love with the series and its main character."
      ]
    },

    {
      year: 2026,
      title: "Book review: Compulsory",
      when: "September 28, 2026",
      rating: 2,
      body: [
        "Review of Compulsory by Martha Wells.",
        { img: "images/compulsory.jpg", alt: "Cover of Compulsory: A Murderbot Story by Martha Wells", caption: "Book cover" },
        "For context, I've now finished book #4 in the series.",
        "This was my first exposure to the Murderbot series, and in hindsight, it probably shouldn't have been. My two-star rating is solely because of this fact.",
        "Going in, I knew nothing about the character or its many nuances, which left me less than impressed. I didn't have the context to appreciate what the story was doing, and it showed in my experience. That being said, having now read up to the 4th entry in the series, I think this would be a great re-read, and I suspect it would land very differently the second time around.",
        "I highly recommend that new readers avoid my mistake. Start with the first or second book in The Murderbot Diaries, and save this one for after you've gotten to know the character."
      ]
    },

    {
      year: 2023,
      title: "Book review: And Then There Were None",
      when: "September 23, 2023",
      rating: 2,
	  body: [
        "Review of And Then There Were None by Agatha Christie.",
        { img: "images/and-then-there-were-none.jpg", alt: "Cover of And Then There Were None by Agatha Christie", caption: "Book cover" },
        "I read this book in English class and loved it. To this day, whenever someone asks me what my favorite book is, I answer And Then There Were None by Agatha Christie.",
        "I haven't read it since 2020, but the experience is still incredibly vivid. My English teacher cleverly designed a scheme that kept us on our toes, forcing us to constantly analyze who the murderer might be. It made me feel like a true detective hunting for clues, making the reading experience intensely immersive. That being said, I'm still slightly mad at my teacher for only rationing out two or three chapters a week. I couldn't focus on anything else until the following Monday!",
        "I don't think I ever figured out who the killer was; while my memory is a bit muddy, I'm pretty sure the ending was a complete surprise I never saw coming.",
        "I highly recommend that new readers try this same paced approach. It requires a lot of self-discipline, but actively engaging with the mystery makes for a wonderful experience. And if you're an English teacher struggling to keep your students engaged, consider this a free tip!"
      ]
    }
	
    {
      year: 2025,
      title: "Book review: The Art of Spending Money",
      when: "September 23, 2023",
      rating: 5,
	  body: [
        "Review of The Art of Spending Money by Morgan Housel.",
        { img: "images/and-then-there-were-none.jpg", alt: "Cover of And Then There Were None by Agatha Christie", caption: "Book cover" },
        "This is a conceptually interesting title that might seem a bit backwards in mainstream media. Shouldn't we be reading The Art of Saving Money instead?",
		"Yet, I believe the premise of this book's title is exactly the right approach. The core idea I took away is to maximize happiness per unit of money spent. Instead of reducing our expenses, intensely budgeting, and obsessing over frugality to maximize savings, we can take a different approach: limit our spending strictly to what brings us joy. In doing so, we may naturally find ourselves saving money simply by choosing not to spend it where it doesn't generate happiness.",
		"How you define that happiness is entirely up to you, as your sources of fulfillment won't necessarily match another individual's.",
		"Great book. I recommend it to anyone who spends money."
		]
    }
  ];

  /* ---------- Rendering: no need to edit below this line ---------- */

  /* Five stars, filled to the rating (half stars allowed). */
  function stars(rating, small) {
    var r = Math.max(0, Math.min(5, Math.round(rating * 2) / 2));
    var label = 'Rated ' + r + ' out of 5';
    var wrap = document.createElement(small ? 'span' : 'p');
    wrap.className = small ? 'pe-rating pe-rating-sm' : 'pe-rating';
    var st = document.createElement('span');
    st.className = 'pe-stars';
    st.style.setProperty('--fill', (r / 5 * 100) + '%');
    st.setAttribute('role', 'img');
    st.setAttribute('aria-label', label);
    wrap.appendChild(st);
    if (small) {
      wrap.setAttribute('aria-hidden', 'true'); /* the full rating is read out in the text */
    } else {
      var txt = document.createElement('span');
      txt.className = 'pe-rating-text';
      txt.textContent = r + ' of 5';
      txt.setAttribute('aria-hidden', 'true');
      wrap.appendChild(txt);
    }
    return wrap;
  }

  (function () {
    var list = document.getElementById('timeline');

    /* Group entries by year. */
    var byYear = {};
    ENTRIES.forEach(function (e) {
      (byYear[e.year] = byYear[e.year] || []).push(e);
    });
    var years = Object.keys(byYear).map(Number).sort(function (a, b) { return a - b; });
    if (NEWEST_FIRST) years.reverse();

    var n = 0;
    years.forEach(function (year, idx) {
      var li = document.createElement('li');
      li.className = 'tl-year';

      /* Dashed line where years are skipped. */
      var next = years[idx + 1];
      if (next !== undefined && Math.abs(next - year) > 1) li.classList.add('jump');

      var label = document.createElement('p');
      label.className = 'tl-label';
      label.textContent = year;
      li.appendChild(label);

      var ul = document.createElement('ul');
      ul.className = 'items';

      byYear[year].forEach(function (e) {
        var id = 'p-' + (n++);
        var item = document.createElement('li');

        var btn = document.createElement('button');
        btn.className = 'item';
        btn.setAttribute('aria-expanded', 'false');
        btn.setAttribute('aria-controls', id);
        btn.textContent = e.title;
        item.appendChild(btn);
        if (typeof e.rating === 'number') item.appendChild(stars(e.rating, true));

        var detail = document.createElement('div');
        detail.className = 'detail';
        detail.id = id;

        var h3 = document.createElement('h3');
        h3.textContent = e.title;
        detail.appendChild(h3);

        if (e.when) {
          var where = document.createElement('p');
          where.className = 'where';
          where.textContent = e.when;
          detail.appendChild(where);
        }
        if (typeof e.rating === 'number') detail.appendChild(stars(e.rating, false));

        (e.body || []).forEach(function (part) {
          if (typeof part === 'string') {
            var p = document.createElement('p');
            p.textContent = part;
            detail.appendChild(p);
          } else {
            var fig = document.createElement('figure');
            if (part.img) {
              var img = document.createElement('img');
              img.src = part.img;
              img.alt = part.alt || '';
              img.loading = 'lazy';
              fig.appendChild(img);
            } else {
              var box = document.createElement('div');
              box.className = 'ph-box';
              box.textContent = 'Picture placeholder';
              fig.appendChild(box);
            }
            if (part.caption) {
              var cap = document.createElement('figcaption');
              cap.textContent = part.caption;
              fig.appendChild(cap);
            }
            detail.appendChild(fig);
          }
        });

        item.appendChild(detail);
        ul.appendChild(item);
      });

      li.appendChild(ul);
      list.appendChild(li);
    });
  })();
</script>
<script src="site.js"></script>
</body>
</html>
