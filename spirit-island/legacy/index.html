function el(tag, attrs = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "checked" || k === "disabled" || k === "selected" || k === "open") e[k] = !!v;
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)){ if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}

function fixNames(str){
  if (typeof str !== "string") return str;
  for (const [a, b] of Object.entries(NAME_FIX.sp)) str = str.split(a).join(b);

function unlockScenario(n, notes){
  const s = SC[n]; if (!s) return;
  const st = S.scen[n] || (S.scen[n] = {u:0, done:0, plays:0, ticks:0});
  if (st.u) return;
  if (s.ticks){
    st.ticks = (st.ticks || 0) + 1;
    if (st.ticks >= s.ticks){ st.u = 1; notes.push(`Scenario ${n} unlocked`); }
    else notes.push(`Scenario ${n}: tick ${st.ticks} of ${s.ticks}`);
    return;
  }
  st.u = 1; notes.push(`Scenario ${n} unlocked`);
}

function unlockInv(n, notes){ if (!INV[n]) return; if (!S.inv[n]){ S.inv[n] = 1; notes.push(`Invader card ${n} added`); } }

function addAspect(spirit, aspect, notes){

function applyUnlocks(n, notes){

// ===================== spirit sheets =====================
function trackComplete(name, t){ const s = sp(name); return (s.checks[t] || 0) >= SP[name].tracks[t]; }
function apexOpen(name){
  const s = sp(name), d = SP[name];
  return Object.keys(d.tracks).every(t => trackComplete(name, t) || s.locked.includes(t));
}
function trackOpen(name, t){
  const s = sp(name);
  if (t === "APEX") return apexOpen(name);
  return s.open.includes(t) && !s.locked.includes(t);
}
function checkBox(name, t, notes){
  const s = sp(name), d = SP[name];
  const size = t === "APEX" ? 5 : d.tracks[t];
  const cur = s.checks[t] || 0;
  if (cur >= size || !trackOpen(name, t)) return false;
  s.checks[t] = cur + 1;
  const box = cur + 1;
  const fx = d.fx[`${t}:${box}`];
  if (fx){
    if (fx.h) unlockHeir(fx.h, notes);
    if (fx.i) unlockInv(fx.i, notes);
    if (fx.s) unlockSpirit(fx.s, notes);
    if (fx.a) addAspect(name, fx.a, notes);
    if (fx.t) for (const x of fx.t) if (!s.open.includes(x)){ s.open.push(x); notes.push(`Track ${x} opened`); }
    if (fx.lock) for (const x of fx.lock) if (!s.locked.includes(x)){ s.locked.push(x); notes.push(`Track ${x} locked`); }
  }
  for (const r of d.rules) if (r.all.every(x => trackComplete(name, x))) for (const x of r.t) if (!s.open.includes(x)){ s.open.push(x); notes.push(`Track ${x} opened`); }
  if (t === "APEX"){
    if (box === 1) notes.push("Apex: add a check to a spirit that wasn’t played this game");
    if (box === 3){ const ids = S.log.length ? S.log[S.log.length - 1].pids : S.players.map(p => p.id); for (const p of S.players) if (ids.includes(p.id)) p.lp += 1; notes.push("Apex: each player gains 1 Legacy Point"); }
    if (box === 5){ s.elder = 1; notes.push(`${name} is now an Elder Spirit`); }
  }
  return true;
}
function apexHeirBonus(name){ return name && (sp(name).checks.APEX || 0) >= 4 ? 1 : 0; }

// ===================== island =====================
function boardStats(b){
  const L = S.boards[b]; let up = 0, scars = 0, other = 0;
  for (const l of LANDS){ if (L[l].up) up++; for (const t of L[l].scars){ if (t === "Scar") scars++; else other++; } }
  return {up, scars, other};
}
function recommendedBoards(k){
  const owned = S.settings.owned.slice();
  if (S.settings.randomBoards) return shuffle(owned).slice(0, k);
  return owned.map(b => [b, boardStats(b)]).sort((a, c) => c[1].up - a[1].up || c[1].scars - a[1].scars || c[1].other - a[1].other || a[0].localeCompare(c[0])).slice(0, k).map(x => x[0]);
}
function stickerCount(k){ let n = 0; for (const b of BOARDS) for (const l of LANDS){ const u = S.boards[b]?.[l]?.up; if (u && (u === k || u.startsWith(k + ":"))) n++; } return n; }

// ===================== invader strength draw =====================
function notBlocked(card, g){
  for (const c of card.not){
    if (c === "solo" && g.players.length === 1) return false;
    if (c.startsWith("spirit:")) continue; // spirits are chosen after the draw; flagged later
    if (g.adv.some(a => a.name === c)) return false;
  }
  return true;
}
function drawInvader(g){
  let remaining = g.isTarget - sum(g.invDrawn.map(n => INV[n].v));
  const deck = shuffle(Object.keys(S.inv).map(Number).filter(n => !g.invDrawn.includes(n) && !g.invIgnored.includes(n)));
  for (const n of deck){
    if (remaining <= 0) break;
    const c = INV[n];
    if (c.v > remaining) continue;
    if (!notBlocked(c, g)) continue;
    g.invDrawn.push(n); remaining -= c.v;
  }
  g.invShort = Math.max(0, remaining);
}

// ===================== game flow =====================
function newGame(pids, n){
  const s = SC[n], st = S.scen[n];
  S.game = {id:uid(), players:pids, n, attempt: (st.plays || 0) >= 1 ? 2 : 1, adv: s.adv.map(a => ({...a})), traded:0,
    extraIS:0, isTarget:null, invDrawn:[], invIgnored:[], invShort:0, spirits:{}, heir:{}, boards:recommendedBoards(pids.length), extraBoards:0,
    stage:"setup", result:null, wrap:{scars:[], steps:{}}};
}
function heirCap(g, pid){ const hv = SC[g.n].hv || 0; return hv + (S.is < 0 ? -S.is : 0) + apexHeirBonus(g.spirits[pid]?.s); }
function finishResult(win, rec){
  const g = S.game, n = g.n, st = S.scen[n], hard = S.settings.hard;
  const openBefore = new Set(available());
  const notes = [];
  const first = (st.plays || 0) === 0;
  st.plays = (st.plays || 0) + 1;
  const isBefore = S.is;
  let lp = 0, complete = false, check = false;
  if (win){ S.is += 1; complete = true; check = true; lp = first ? 2 : 1; }
  else {
    S.is += S.settings.lossIS;
    if (first){ lp = 1; S.forced = n; }
    else { check = true; complete = !hard.includes(1); lp = hard.includes(1) ? 0 : 1; S.forced = null; }
  }
  if (hard.includes(6)) lp = complete ? 1 : 0;
  if (win) S.forced = null;
  for (const p of S.players) if (g.players.includes(p.id)) p.lp += lp;
  const played = [...new Set(Object.values(g.spirits).map(x => x.s).filter(Boolean))];
  if (check) for (const nm of played) sp(nm).pending += 1;
  g.result = {win, first, lp, complete, isBefore, isAfter:S.is, played, opened:[]};
  if (complete){ st.done = 1; applyUnlocks(n, notes); }
  if (!win) openEnvelope("1", notes);
  const used = Object.values(g.heir).flat();
  if (win && [64, 65, 66].every(h => used.includes(h))) openEnvelope("2", notes);
  S.lastHeir = used;
  g.stage = "wrap";
  g.result.opened = available().filter(x => !openBefore.has(x));
  const ts = Date.now(), d = new Date(ts), pad = x => String(x).padStart(2, "0");
  const scName = SC[n].sc === "Surges of Colonization" && rec && rec.surges ? `${rec.surges} Surges of Colonization` : (SC[n].sc || "");
  S.log.push({ts, id: "L" + ts.toString(36), date: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, rec: rec || null, scName,
    slots: S.players.filter(p => g.players.includes(p.id)).map(p => ({player: p.name, spirit: g.spirits[p.id]?.s || "", aspect: g.spirits[p.id]?.a || ""})),
    advs: g.adv.map(a => ({name: a.name, level: a.level ?? null})), boards: g.boards.slice(), rules: (SC[n].rules || []).slice(),
    n, t: SC[n].title || SC[n].t, attempt: g.attempt, win, pids: g.players.slice(),
    names: S.players.filter(p => g.players.includes(p.id)).map(p => p.name), spirits: Object.entries(g.spirits).map(([pid, x]) => x.s + (x.a ? ` (${x.a})` : "")),
    is: isBefore, isAfter: S.is, inv: g.invDrawn.slice(), heir: used, adv: g.adv.map(a => `${a.name} ${a.level ?? ""}`.trim()), notes: ""});
  return notes;
}
function addScar(b, l, type, notes){
  const land = S.boards[b][l];

  return true;
}

function compactBoards(){
  const out = {};
  for (const b of BOARDS) for (const l of LANDS){ const L = S.boards[b]?.[l]; if (L && (L.scars.length || L.up)) (out[b] = out[b] || {})[l] = {s:L.scars.slice(), u:L.up || null}; }

// ---------- campaign map (Legacy) ----------
const ENV_SCEN = {15:"Env 1", 16:"Env 2", 70:"Env 3", 74:"Env 4", 13:"Env C", 27:"Env I"};
let LMAP = null;
function legacyLayout(){
  if (LMAP) return LMAP;
  const kids = {}, parents = {};
  const link = (a, b) => { (kids[a] = kids[a] || new Set()).add(b); (parents[b] = parents[b] || new Set()).add(a); };
  for (const s of D.scen){ const u = s.un; for (const x of [...u.scen, ...(u.choice || []), ...(u.orIfBoth ? [u.orIfBoth.alt] : [])]) if (SC[x] && x !== s.n) link(s.n, x); }
  const depth = {1:0}, q = [1];
  for (const n of Object.keys(ENV_SCEN).map(Number)) if (depth[n] == null){ depth[n] = 2; q.push(n); }
  while (q.length){ const n = q.shift(); for (const k of kids[n] || []) if (depth[k] == null){ depth[k] = depth[n] + 1; q.push(k); } }
  const maxD = Math.max(...Object.values(depth));
  for (const s of D.scen) if (depth[s.n] == null) depth[s.n] = maxD + 1;
  const layers = {};
  for (const s of D.scen) (layers[depth[s.n]] = layers[depth[s.n]] || []).push(s.n);
  const pos = {};
  const L = Object.keys(layers).map(Number).sort((a, b) => a - b);
  for (const d of L){
    const arr = layers[d];
    const bary = n => { const ps = [...(parents[n] || [])].filter(p => pos[p]); return ps.length ? ps.reduce((a, p) => a + pos[p].y, 0) / ps.length : n * 3; };
    arr.sort((a, b) => bary(a) - bary(b) || a - b);
    arr.forEach((n, i) => { pos[n] = {x: d * 175, y: (i - (arr.length - 1) / 2) * 92}; });
  }
  LMAP = {pos, kids, parents};
  return LMAP;
}
function legacyMapModel(){
  const {pos, kids} = legacyLayout();
  const state = n => {
    const st = S.scen[n];
    if (st?.done) return S.log.some(l => l.n === n && l.win) ? "won" : "lost";
    if (st?.u) return S.forced === n ? "replay" : "open";
    return null;
  };
  const vis = new Set(D.scen.filter(s => state(s.n)).map(s => s.n));
  const fog = new Set();
  for (const n of vis) for (const k of kids[n] || []) if (!vis.has(k)) fog.add(k);
  const nodes = [], edges = [];
  for (const n of [...vis, ...fog]){
    const s = SC[n], st = state(n) || "fog", tk = s.ticks ? `${S.scen[n]?.ticks || 0}/${s.ticks}` : null;
    nodes.push({id:String(n), x:pos[n].x, y:pos[n].y, state:st, label:String(n), sub: st === "fog" ? "" : s.t, badge: tk && st === "fog" ? tk : (ENV_SCEN[n] && st !== "fog" ? "✉" : null)});
  }
  for (const n of vis) for (const k of kids[n] || []) if (vis.has(k) || fog.has(k)) edges.push({a:String(n), b:String(k), fog:!vis.has(k)});
  return {nodes, edges, selected: ui.mapSel ? String(ui.mapSel) : null, view: ui.mapView || null,
    onView: v => { ui.mapView = {...v}; }, onSelect: id => { ui.mapSel = +id; renderLegacyMapInfo(); if (ui.mapH){ ui.mapH.model.selected = id; CampaignMap.update(ui.mapH, {...ui.mapH.model, view:ui.mapView}); } }};
}

  /**

  function createFallbackBoardTexture(boardId, boardSlots) {
    var canvas = document.createElement('canvas');
    canvas.width = 768;
    canvas.height = Math.round(768 / BOARD_ASPECT);
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;

    ctx.fillStyle = '#1b6ca8';
    ctx.fillRect(0, 0, W, H);

    var palette = ['#7f8589','#89c9d4','#4f8c49','#d4a762','#84c2cf','#888d91','#cf9f55','#488542'];
    var centers = [];
    for (var l = 1; l <= 8; l++) {
      var ls = boardSlots && boardSlots[String(l)];
      if (ls && ls.up) {
        var sx = ls.up[0], sy = ls.up[1], n = 1;
        if (ls.scars) {
          for (var s = 0; s < ls.scars.length; s++) {
            if (ls.scars[s]) { sx += ls.scars[s][0]; sy += ls.scars[s][1]; n++; }
          }
        }
        centers.push({ x: (sx / n) * W, y: (sy / n) * H, color: palette[(l - 1) % 8] });
      }
    }

    if (centers.length > 0) {
      var step = 8;
      for (var py = 0; py < H; py += step) {
        for (var px = 0; px < W; px += step) {
          if (px < W * 0.16 && py < H * 0.80) continue;
          var d1 = 1e9, d2 = 1e9, col = centers[0].color;
          for (var c = 0; c < centers.length; c++) {
            var d = Math.hypot(px - centers[c].x, py - centers[c].y);
            if (d < d1) { d2 = d1; d1 = d; col = centers[c].color; }
            else if (d < d2) { d2 = d; }
          }
          ctx.fillStyle = (d2 - d1 < 7) ? '#47301d' : col;
          ctx.fillRect(px, py, step, step);
        }
      }
    }

    ctx.strokeStyle = '#3d2716';
    ctx.lineWidth = 10;
    ctx.beginPath();
    for (var i = 0; i < ISLAND_CONTOUR.length; i++) {
      var ix = ISLAND_CONTOUR[i][0] * W, iy = ISLAND_CONTOUR[i][1] * H;
      if (i === 0) ctx.moveTo(ix, iy); else ctx.lineTo(ix, iy);
    }
    ctx.closePath();
    ctx.stroke();

    if (boardSlots) {
      for (var k in boardSlots) {
        var sd = boardSlots[k];
        if (!sd) continue;
        if (Array.isArray(sd.scars)) {
          for (var sc = 0; sc < sd.scars.length; sc++) {
            var pt = sd.scars[sc];
            if (!pt) continue;
            ctx.fillStyle = 'rgba(255,255,255,0.28)';
            ctx.strokeStyle = '#3b2514';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(pt[0] * W, pt[1] * H, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          }
        }
        if (Array.isArray(sd.up)) {
          drawDiamondPath(ctx, sd.up[0] * W, sd.up[1] * H, 20);
          ctx.fillStyle = 'rgba(255,255,255,0.28)';
          ctx.strokeStyle = '#3b2514';
          ctx.lineWidth = 2.5;
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#111111';
          ctx.font = 'bold 18px system-ui, sans-serif';
          ctx.fillText(String(k), sd.up[0] * W - 26, sd.up[1] * H + 8);
        }
      }
    }

    var tex = new THREE.CanvasTexture(canvas);
    tex.needsUpdate = true;
    return tex;
  }

  function computeBoardLayoutPositions(count, layoutMode) {
    var positions = [], gapX = BOARD_W + 0.65, gapZ = BOARD_D + 0.65;
    if (layoutMode === 'grid' && count > 1) {
      var cols = Math.ceil(Math.sqrt(count)), rows = Math.ceil(count / cols);
      for (var i = 0; i < count; i++) {
        positions.push({
          x: ((i % cols) - (cols - 1) / 2) * gapX,
          z: (Math.floor(i / cols) - (rows - 1) / 2) * gapZ
        });
      }
    } else {
      for (var j = 0; j < count; j++) {
        positions.push({ x: (j - (count - 1) / 2) * gapX, z: 0 });
      }
    }
    return positions;
  }

  function frameCameraForPlaces(camera, controls, boardsCfg) {
    var x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity, rr = (BOARD_W + BOARD_D) / 4;
    boardsCfg.forEach(function (b) { var p = b.place || { x: 0, z: 0 }; x0 = Math.min(x0, p.x - rr); x1 = Math.max(x1, p.x + rr); z0 = Math.min(z0, p.z - rr); z1 = Math.max(z1, p.z + rr); });
    if (!isFinite(x0)) { x0 = -5; x1 = 5; z0 = -4; z1 = 4; }
    var cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, spanX = x1 - x0, spanZ = z1 - z0;
    var fovRad = (camera.fov * Math.PI) / 180;
    var fitW = (spanX * 0.5) / (Math.tan(fovRad / 2) * Math.max(0.6, Math.min(1.9, camera.aspect || 1.5)));
    var fitH = (spanZ * 0.5) / Math.tan(fovRad / 2);
    var dist = Math.max(8.5, fitW, fitH) * 1.08;
    var lookDown = (58 * Math.PI) / 180;
    camera.position.set(cx, Math.sin(lookDown) * dist, cz + Math.cos(lookDown) * dist);
    controls.target.set(cx, 0, cz);
    controls.maxDistance = Math.max(45, dist * 2.6);
    controls.minDistance = 3.2;
    controls.update();
  }

  function frameCameraForBoards(camera, controls, count, layoutMode) {
    var cols = (layoutMode === 'grid' && count > 1) ? Math.ceil(Math.sqrt(count)) : Math.max(1, count);
    var rows = (layoutMode === 'grid' && count > 1) ? Math.ceil(count / cols) : 1;
    var spanX = cols * (BOARD_W + 0.65), spanZ = rows * (BOARD_D + 0.65);
    var fovRad = (camera.fov * Math.PI) / 180;
    var fitW = (spanX * 0.62) / (Math.tan(fovRad / 2) * Math.min(1.25, camera.aspect || 1.5));
    var fitH = (spanZ * 0.68) / Math.tan(fovRad / 2);
    var dist = Math.max(11.2, fitW, fitH);
    var lookDown = (50 * Math.PI) / 180; // 50 degrees looking down
    camera.position.set(0, Math.sin(lookDown) * dist, Math.cos(lookDown) * dist);
    controls.target.set(0, 0, 0);
    controls.maxDistance = Math.max(45, dist * 2.6);
    controls.minDistance = 3.2;
    controls.update();
  }

async function renderThumb(kind, n){

const LS_KEY = "si-legacy-companion-v1";

async function save(){
  if (writing){ pending = true; return; }
  writing = true;
  try {
    do {
      pending = false;
      const snap = JSON.stringify(S); lastWrittenRev = S.rev;
      if (store?.kind === "db") await store.doc.set({state:snap, rev:S.rev});
      else if (store?.kind === "local") localStorage.setItem(LS_KEY, snap);
    } while (pending);
    $("sync").textContent = saveLabel();
  } catch(e){ $("sync").textContent = "Couldn’t save the last change (view-only access, or offline). Make another change to retry."; }
  finally { writing = false; }
}
async function load(){
  try {
    const db = window.claude ? await window.claude.use("db") : null;
    try { assetsApi = window.claude ? await window.claude.use("assets") : null; } catch(e){ assetsApi = null; }
    if (db){
      const doc = db.doc("data/legacy/campaign/state");
      const snap = await doc.get();
      store = {kind:"db", doc};
      if (snap.exists) S = loadState(snap.data().state);
      doc.onSnapshot(sn => {
        if (!sn.exists) return;
        const d = sn.data();
        if (d.rev != null && d.rev !== lastWrittenRev && d.rev > (S?.rev || 0) && !writing){
          S = loadState(d.state); render(); toast("Updated from another device");
        }
      }, () => {});
    }
  } catch(e){ store = null; }
  if (!store){
    try { const raw = localStorage.getItem(LS_KEY); store = {kind:"local"}; if (raw) S = loadState(raw); } catch(e){ store = null; }
  }
  if (!S) S = blank();
  if (S.started && !(S.timeline && S.timeline.length)){ S.timeline = []; snapshotIsland(S.log.length ? "When recording started" : "Campaign start"); }
  $("sync").textContent = saveLabel();
  render();
}

$("rdPrev").onclick = () => step(-1);
$("rdNext").onclick = () => step(1);
$("rdZoomIn").onclick = () => { rd.zoom = Math.min(3, rd.zoom + 0.5); renderReader(); };
$("rdZoomOut").onclick = () => { rd.zoom = Math.max(1, rd.zoom - 0.5); renderReader(); };
$("rdCardToggle").onclick = () => { if (rd.card){ rd.lastCard = rd.card; rd.card = null; } else { rd.card = rd.lastCard || (rd.page - 1) * 16 + 1; rd.page = pageOfCard(rd.card); } renderReader(); };
$("reader").addEventListener("click", e => { if (e.target === $("reader")) closeReader(); });
document.addEventListener("keydown", e => {
  if (!$("reader").classList.contains("open")) return;
  if (e.key === "Escape") closeReader();
  else if (e.key === "ArrowRight" && !$("rdNext").disabled) step(1);
  else if (e.key === "ArrowLeft" && !$("rdPrev").disabled) step(-1);
});
let rsz; window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if ($("reader").classList.contains("open")) renderReader(); }, 200); });
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
setupTableModeL();
S = blank(); render();
load();

</script>
